name: DCO Check
on: [pull_request, push]

jobs:
  dco:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check commit sign-offs
        run: |
          set -e
          # Check last commits in the PR (for push, checks HEAD..)
          RANGE=${{ github.event.pull_request.head.sha }} || RANGE=HEAD
          git fetch --no-tags --depth=200 origin +refs/heads/*:refs/remotes/origin/*
          # List commits to validate
          commits=$(git log --format=%H ${{ github.sha }} -n 200)
          bad=0
          for c in $commits; do
            if ! git show -s --format=%B $c | grep -iq "Signed-off-by:"; then
              echo "Commit $c missing Signed-off-by:"
              bad=1
            fi
          done
          if [ "$bad" -eq 1 ]; then
            echo "DCO check failed: add Signed-off-by to commits (use git commit -s)."
            exit 1
          fi
